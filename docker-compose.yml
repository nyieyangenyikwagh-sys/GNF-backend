services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: [".:/app"]
    environment:
      DATABASE_URL: postgresql://rcm_user:rcm_pass@postgres:5432/rcm_db
      REDIS_URL: redis://redis:6379
      SECRET_KEY: dev-secret-change-in-production
    depends_on: [postgres, redis]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rcm_user
      POSTGRES_PASSWORD: rcm_pass
      POSTGRES_DB: rcm_db
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
