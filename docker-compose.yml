services:

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ".:/app"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://rcm:rcm@postgres:5432/rcm
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $${PORT:-8000} --reload --reload-dir /app"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rcm
      POSTGRES_USER: rcm
      POSTGRES_PASSWORD: rcm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcm -d rcm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
